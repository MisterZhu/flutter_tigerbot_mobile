def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    //namespace的值用于代码包名，而applicationId用于唯一标识应用程序
    namespace "com.tigerbot.chat"
    compileSdkVersion 33
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            storeFile file('../tigerbot.keystore')
            keyAlias 'tigerbot'
            keyPassword 'tb123456'
            storePassword 'tb123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file('../tigerbot.keystore')
            keyAlias 'tigerbot'
            keyPassword 'tb123456'
            storePassword 'tb123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        //namespace的值用于代码包名，而applicationId用于唯一标识应用程序,applicationId可以与namespace相同，但在实际开发中，applicationId可以独立于代码包名（即namespace）进行配置
//        applicationId "com.tigerbot.chat"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
//        minSdkVersion flutter.minSdkVeError: Attribute application@name at AndroidManifest.xml:14:9-42 requires a placeholder substitution but no value for <applicationName> is provided.rsion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        minSdkVersion 21
//        ndk {
//            //选择要添加的对应 cpu 类型的 .so 库。
//            abiFilters 'armeabi', 'armeabi-v7a', 'x86', 'x86_64', 'mips', 'mips64', 'arm64-v8a'
//        }
//
//        manifestPlaceholders = [
//                JPUSH_PKGNAME : applicationId,
//                JPUSH_APPKEY : "b4f24d7e5726088ee24b1686", // NOTE: JPush 上注册的包名对应的 Appkey.
//                JPUSH_CHANNEL : "developer-default", //暂时填写默认值即可.
//        ]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
//        release {
//            manifestPlaceholders = [applicationName: "android.app.Application"]
//        }
//
//        debug {
//            manifestPlaceholders = [applicationName: "android.app.Application"]
//        }
//
//        build {
//            manifestPlaceholders = [applicationName: "android.app.Application"]
//        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
//    implementation 'cn.jiguang.sdk:jpush:5.2.0'

}
