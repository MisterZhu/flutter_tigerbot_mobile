name: TigerChat
description: TigerChat App

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.2.8+15

environment:
  sdk: ">=2.17.0 <3.0.0"
fluwx:
  app_id: 'wx61d3970bb819f20c'
  debug_logging: true # Logging in debug mode.
  android:
  #    interrupt_wx_request: true # Defaults to true.
  #    flutter_activity: 'MainActivity' # Defaults to app's launcher
  ios:
    universal_link: https://www.tigerbot.com/app/

dependencies:
  flutter:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  azlistview: ^2.0.0-nullsafety.0
  cupertino_icons: ^1.0.4
  cached_network_image: ^3.2.0
  dio: ^5.2.1+1
  #提示框组件 https://pub.dev/packages/fluttertoast/install
  fluttertoast: ^8.2.4
  webview_flutter: ^3.0.4
  package_info: ^2.0.2
  device_info_plus: ^9.1.2
  provider: ^6.0.5
  get: ^4.6.5
  uuid: ^3.0.7
  shared_preferences: ^2.2.0
  event_bus: ^2.0.0
  photo_view: ^0.14.0
  #loading动画库 https://pub.dev/packages/flutter_spinkit/install
  flutter_spinkit: ^5.2.0
  flutter_screenutil: ^5.8.4
  #flutter_markdown https://pub.dev/packages/flutter_markdown/changelog
  flutter_markdown: 0.6.18
  flutter_highlighter: ^0.1.1
  bruno: ^3.4.3
  file_picker: ^5.3.3
  image_picker: ^1.0.2
  auto_size_text: ^3.0.0
  #加载组件 https://pub.flutter-io.cn/packages/flutter_easyloading/install
  flutter_easyloading: ^3.0.5
  #获取手机各种权限 https://pub.flutter-io.cn/packages/permission_handler/install
  permission_handler: ^11.0.0
  #生成图片保存 https://pub.dev/packages/image_gallery_saver/install
  image_gallery_saver: ^2.0.3
  #获取文件路径 https://pub.dev/packages/path_provider/install
  path_provider: ^2.1.1
  #生成二维码 https://pub.dev/packages/qr_flutter/install
  qr_flutter: ^4.1.0
  #获取截屏 https://pub.dev/packages/flutter_screenshot_callback/install
  flutter_screenshot_callback: ^0.0.9
  #微信sdk https://pub.dev/packages/fluwx/install
  fluwx: ^4.4.9
  #渲染数学公式 https://pub.dev/packages/flutter_math_fork/install
  flutter_math_fork: ^0.7.1
  #仿微信录音的插件 https://pub.dev/packages/flutter_plugin_record_plus/install
  flutter_plugin_record_plus: ^0.0.16
  #分组列表插件 https://pub.dev/packages/flutter_sticky_header/install
  flutter_sticky_header: ^0.6.5
  #极光推送插件 https://pub.dev/packages/jpush_flutter/install
#  jpush_flutter: ^2.5.0
  flutter_localization: ^0.2.0
  #处理数据流插件 https://pub-web.flutter-io.cn/packages/flutter_client_sse/install
  flutter_client_sse: ^2.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data/
    - assets/images/home/
    - assets/images/mine/
    - assets/images/chat/
    - assets/images/common/
    - assets/images/login/


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true